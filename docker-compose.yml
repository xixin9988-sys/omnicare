services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/omnicare.db}
    ports:
      # Loopback only. AUTH_MODE=dev trusts X-User-Id, so this demo stack must never be
      # reachable from the LAN. Anything public must use docker-compose.prod.yml (token auth).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional workflow engine. Start with: docker compose --profile automation up --build
  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
