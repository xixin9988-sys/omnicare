# Production-shaped stack: OIDC/JWT identity, PostgreSQL row locks, no dev identity.
#
# Pick ONE identity mode:
#   self-hosted JWT (HS256, strong secret):   AUTH_MODE=jwt  + AUTH_SECRET
#   external IdP (OIDC, RS256 + JWKS):        AUTH_MODE=oidc + AUTH_JWT_ISSUER + AUTH_JWT_AUDIENCE + AUTH_JWKS_URL
#
#   export AUTH_SECRET=$(python -c "import secrets;print(secrets.token_hex(32))")
#   export POSTGRES_PASSWORD=$(python -c "import secrets;print(secrets.token_hex(24))")
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Issue a demo token on a trusted machine (never in production logs):
#   python -m app.auth_cli issue-token --user demo_user_001 --role user --scopes omnicare.read
#
# The app refuses to start with APP_ENV=production + AUTH_MODE=dev or with the legacy
# self-signed AUTH_MODE=token (see app/core/preflight.py): a missing AUTH_MODE cannot
# silently re-enable X-User-Id identity.
services:
  api:
    environment:
      APP_ENV: production
      AUTH_MODE: ${AUTH_MODE:-jwt}
      # Required (>=32 chars) when AUTH_MODE=jwt; OIDC deployments use AUTH_JWKS_URL instead.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://omnicare.example.com}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-omnicare-api}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_ALLOWED_TENANTS: ${AUTH_ALLOWED_TENANTS:-default}
      AUTH_REVOKED_JTIS: ${AUTH_REVOKED_JTIS:-}
      MCP_REQUIRED_SCOPES: ${MCP_REQUIRED_SCOPES:-omnicare.read}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://127.0.0.1:9000/mcp}
      DATABASE_URL: postgresql+asyncpg://omnicare:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/omnicare
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnicare
      POSTGRES_DB: omnicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicare -d omnicare"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
