# Production-shaped stack: signed bearer tokens, PostgreSQL row locks, no dev identity.
#
#   export AUTH_SECRET=$(python -c "import secrets;print(secrets.token_hex(32))")
#   export ADMIN_API_KEY=$(python -c "import secrets;print(secrets.token_hex(24))")
#   export MCP_AUTH_TOKEN=$(python -c "import secrets;print(secrets.token_hex(24))")
#   export POSTGRES_PASSWORD=$(python -c "import secrets;print(secrets.token_hex(24))")
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The app refuses to start with APP_ENV=production + AUTH_MODE=dev (see app/core/preflight.py),
# so a missing AUTH_MODE cannot silently re-enable X-User-Id identity.
services:
  api:
    environment:
      APP_ENV: production
      AUTH_MODE: token
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required in production (>=32 chars)}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required in production}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required in production}
      DATABASE_URL: postgresql+asyncpg://omnicare:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/omnicare
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnicare
      POSTGRES_DB: omnicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicare -d omnicare"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
