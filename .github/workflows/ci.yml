name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: contracts (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings httpx pytest pytest-asyncio
          pip install "mem-guard @ git+https://github.com/xixin9988-sys/mem-guard.git@v0.1.1"
      - name: Run contract tests
        run: pytest contract_tests -q

  lint:
    name: ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  full-suite:
    name: full suite (non-blocking until Phase 1.5)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run full tests
        run: pytest tests -q
